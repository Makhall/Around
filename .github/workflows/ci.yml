name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Lint, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_JSON is not set; using the example config for compilation only."
            cp app/google-services.json.example app/google-services.json
          fi

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Upload reports and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/
          if-no-files-found: ignore

  backend:
    name: API and security-rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            tests/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix backend

      - name: Build API
        run: npm --prefix backend run build

      - name: Install test dependencies
        run: npm ci --prefix tests

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Run emulator rules and API tests
        run: |
          firebase emulators:exec \
            --only auth,firestore,database \
            --project around-847b3 \
            "npm --prefix tests test"
